name: Release

# Tag-triggered only. This workflow does NOT publish anything: Packagist has no npm/PyPI/RubyGems
# style publish credential at all. A brand-new package needs a one-time MANUAL submission on
# packagist.org (an operator enters this repo's URL once) before it exists on Packagist at all --
# verified this session against packagist.org's own documentation. After that one-time step,
# Packagist auto-updates on every push via a GitHub webhook it configures itself, with no API
# token needed in CI. Pushing this tag *is* the publish action, once that webhook exists; this
# workflow exists only as a safety gate re-confirming the two-tag contract and the test suite at
# the exact tagged commit.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify canonical spec tag exists in polytypo/polytypo
        run: php script/verify-spec-tag.php

      # The step above proves the tag exists; this one proves the vendored tree equals it.
      # CI on main runs the same check, but a tag can be pushed to a commit CI never saw,
      # and this is the last point before a package is built from that tree
      # (polytypo/polytypo#56).
      - name: Verify the vendored spec matches that tag
        run: sh script/check-vendored-spec.sh resources/spec

      - name: Lint (PHP_CodeSniffer, PSR-12)
        run: vendor/bin/phpcs

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse

      - name: Test
        run: vendor/bin/phpunit --testsuite=unit

      - name: Packaging smoke test
        run: bash script/packaging-smoke-test.sh
